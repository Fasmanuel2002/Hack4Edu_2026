<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Twins for Change</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Twins for Change: an offline-first bilingual Yorùbá–English AI tutor. Gemma answers from verified examples found with hybrid RAG.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C2D64" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
  <script>
    // Apply a saved theme before the first paint. Without one, CSS follows prefers-color-scheme.
    try {
      var savedTheme = localStorage.getItem('tfc.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
