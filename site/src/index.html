<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Twins for Change</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Twins for Change: an offline-first bilingual Yorùbá–English AI tutor. Gemma answers from verified examples found with hybrid RAG.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#052D4B" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <!-- Link previews. Scrapers need an absolute image URL: change the host if the site lives elsewhere. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Twins for Change">
  <meta property="og:title" content="Twins for Change: an offline-first Yorùbá–English AI tutor">
  <meta property="og:description" content="Gemma answers from verified bilingual examples, found with hybrid search. It can run on one computer in the classroom, with no internet.">
  <meta property="og:image" content="https://twinsforchange.com/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Twins for Change: knowledge should have no borders.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The body face and the display face of every page title, self-hosted (same URLs as the
       @font-face rules in styles.css), so neither swaps in after the first paint. -->
  <link rel="preload" href="/fonts/twins-sans-regular.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply a saved theme before the first paint. Without one, CSS follows prefers-color-scheme.
    try {
      var savedTheme = localStorage.getItem('tfc.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
