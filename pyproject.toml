[project]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
name = "hack4edu-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.162.0",
    "fastembed>=0.7.4",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.1.0",
    "pymupdf<2",
    "python-docx>=1.2.0",
    "qdrant-client>=1.20.0",
]

[tool.uv]
# Intel Mac: newer onnxruntime (needed by fastembed) has no x86_64 macOS wheels
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
