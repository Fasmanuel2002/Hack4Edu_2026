x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - 127.0.0.1:6333:6333
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 2g
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - ollama_data:/root/.ollama
    logging: *default-logging

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "until ollama list >/dev/null 2>&1; do sleep 1; done && ollama pull bge-m3"

  hack_edu_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - 127.0.0.1:8000:8000   # solo local: para probar con túnel SSH
    depends_on:
      qdrant:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_CLIENT_URL=http://qdrant:6333
      - HOST=0.0.0.0
      - PORT=8000
    command: uv run python main.py
    logging: *default-logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hack_edu_app
    logging: *default-logging

volumes:
  qdrant_data:
  ollama_data:
  caddy_data:
  caddy_config: