services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:6333:6333
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:                     
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "until ollama list >/dev/null 2>&1; do sleep 1; done && ollama pull bge-m3"

  hack_edu_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      qdrant:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434  
      - QDRANT_CLIENT_URL=http://qdrant:6333
      - HOST=0.0.0.0
      - PORT=8000
  
    command: uv run python main.py

volumes:
  qdrant_data:
  ollama_data: